<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<script src="config.js"></script>
<title>จอเมนู • กาแฟสดบ้านปู</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&family=Sarabun:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--pri:#6B4226;--acc:#E8A33D;--bg:#1A100A;--card:#FFF8EF;--ink:#2B1D14;--u:1vmin;--fs:1;--fp:1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Prompt','Sarabun',sans-serif;color:#FFF3E3}
body.hidecur{cursor:none}

/* ---------- ฉากหลังเคลื่อนไหว ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.blob{position:fixed;border-radius:50%;filter:blur(calc(9*var(--u)));opacity:.55;z-index:0;pointer-events:none;animation:drift 26s ease-in-out infinite alternate}
.b1{width:calc(70*var(--u));height:calc(70*var(--u));background:var(--pri);top:-25vmin;right:-15vmin}
.b2{width:calc(55*var(--u));height:calc(55*var(--u));background:var(--acc);bottom:-30vmin;left:-15vmin;opacity:.28;animation-duration:32s}
.b3{width:calc(40*var(--u));height:calc(40*var(--u));background:#C26A8A;top:40%;left:45%;opacity:.13;animation-duration:38s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmin,-4vmin) scale(1.12)}100%{transform:translate(-5vmin,5vmin) scale(.95)}}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.05;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:4px 4px}

#stage{position:fixed;inset:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);z-index:1;overflow:hidden}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:calc(2.2*var(--u));padding:calc(2.4*var(--u)) calc(3.6*var(--u)) calc(1.4*var(--u))}
.logo-wrap{position:relative;flex-shrink:0}
.logo{width:calc(9*var(--u));height:calc(9*var(--u));border-radius:calc(2.4*var(--u));background:linear-gradient(135deg,var(--acc),#f6c76f);display:grid;place-items:center;font-size:calc(var(--fs)*5*var(--u));overflow:hidden;box-shadow:0 0 0 calc(.4*var(--u)) rgba(255,255,255,.12),0 calc(1*var(--u)) calc(3*var(--u)) rgba(0,0,0,.4)}
.logo img{width:100%;height:100%;object-fit:cover}
.steam{position:absolute;left:50%;bottom:100%;width:calc(6*var(--u));height:calc(6*var(--u));transform:translateX(-50%);pointer-events:none}
.steam i{position:absolute;bottom:0;width:calc(1.1*var(--u));height:calc(4.5*var(--u));border-radius:50%;background:linear-gradient(to top,rgba(255,255,255,.55),transparent);filter:blur(calc(.35*var(--u)));opacity:0;animation:steam 3.2s ease-in-out infinite}
.steam i:nth-child(1){left:18%}.steam i:nth-child(2){left:45%;animation-delay:1.1s}.steam i:nth-child(3){left:72%;animation-delay:2.1s}
@keyframes steam{0%{transform:translateY(calc(2*var(--u))) scaleX(1);opacity:0}30%{opacity:.85}100%{transform:translateY(calc(-3*var(--u))) scaleX(2.2) skewX(14deg);opacity:0}}
.shop{font-weight:800;font-size:calc(var(--fs)*4.6*var(--u));line-height:1.08;color:#fff;letter-spacing:.01em;background:linear-gradient(90deg,#fff 0%,#fff 40%,var(--acc) 50%,#fff 60%,#fff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 7s linear infinite}
@keyframes shine{0%{background-position:120% 0}100%{background-position:-120% 0}}
.tag{font-size:calc(var(--fs)*2.1*var(--u));opacity:.75;font-family:'Sarabun'}
.hr{margin-left:auto;display:flex;align-items:center;gap:calc(2.4*var(--u))}
.clock{text-align:right;font-size:calc(var(--fs)*1.9*var(--u));opacity:.9}
.clock b{display:block;font-size:calc(var(--fs)*4.2*var(--u));font-weight:700;color:var(--acc);line-height:1;font-variant-numeric:tabular-nums}
.clock b .col{animation:blink 2s steps(1) infinite}
@keyframes blink{50%{opacity:.2}}
.qr{display:flex;align-items:center;gap:calc(1.2*var(--u));background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:calc(2*var(--u));padding:calc(.8*var(--u)) calc(1.4*var(--u)) calc(.8*var(--u)) calc(.8*var(--u));backdrop-filter:blur(6px)}
.qr img{width:calc(8.5*var(--u));height:calc(8.5*var(--u));background:#fff;border-radius:calc(1*var(--u));padding:calc(.4*var(--u))}
.qr span{font-size:calc(var(--fs)*1.7*var(--u));line-height:1.25;white-space:nowrap}
.qr b{display:block;font-size:calc(var(--fs)*2.1*var(--u));color:var(--acc)}

/* ---------- slides ---------- */
#slides{position:relative;overflow:hidden}
.slide{position:absolute;inset:0;padding:0 calc(3.6*var(--u)) calc(1*var(--u));display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateX(5%) scale(.98);filter:blur(6px);transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.8,.2,1),filter .9s ease,visibility 0s 1.1s}
.slide.on{opacity:1;visibility:visible;transform:none;filter:none;transition:opacity .9s ease .15s,transform 1.1s cubic-bezier(.2,.8,.2,1) .15s,filter .9s ease .15s,visibility 0s}
.slide.out{transform:translateX(-5%) scale(.98)}
.s-title{display:flex;align-items:center;gap:calc(1.6*var(--u));margin-bottom:calc(2*var(--u))}
.s-title .em{font-size:calc(var(--fs)*5.4*var(--u));display:inline-block}
.s-title h2{font-size:calc(var(--fs)*5.2*var(--u));font-weight:800;color:#fff;line-height:1.1}
.s-title .pg{margin-left:auto;font-size:calc(var(--fs)*2*var(--u));opacity:.6}
.s-title .line{flex:1;height:calc(.45*var(--u));background:linear-gradient(90deg,var(--acc),transparent);border-radius:9px;transform-origin:left}
.on .s-title .em{animation:popSpin .9s cubic-bezier(.3,1.6,.5,1) both .3s}
.on .s-title h2{animation:slideR .8s cubic-bezier(.2,.8,.2,1) both .4s}
.on .s-title .line{animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both .55s}
@keyframes popSpin{0%{transform:scale(0) rotate(-120deg)}100%{transform:none}}
@keyframes slideR{0%{transform:translateX(-6vmin);opacity:0}100%{transform:none;opacity:1}}
@keyframes grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}

/* card grid */
.grid{flex:1;display:grid;gap:calc(2*var(--u));min-height:0}
.grid.fx{display:flex;flex-wrap:wrap;justify-content:center;align-content:stretch}
.grid.fx>.card{width:calc((100% - (var(--c) - 1) * 2 * var(--u)) / var(--c));height:calc((100% - (var(--r) - 1) * 2 * var(--u)) / var(--r))}
.card{background:var(--card);color:var(--ink);border-radius:calc(2.6*var(--u));overflow:hidden;display:flex;flex-direction:column;box-shadow:0 calc(1*var(--u)) calc(3.5*var(--u)) rgba(0,0,0,.4);min-height:0;position:relative;opacity:0}
.on .card{animation:cardIn .85s cubic-bezier(.2,.9,.25,1.15) both;animation-delay:calc(.5s + var(--i) * .11s)}
@keyframes cardIn{0%{opacity:0;transform:translateY(6vmin) scale(.88) rotate(-2deg)}100%{opacity:1;transform:none}}
.card .img{flex:1;min-height:0;position:relative;display:grid;place-items:center;font-size:calc(var(--fs)*9*var(--u));overflow:hidden}
.card .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.on .card .img img:not(.pbg):not(.pfg){animation:kb 16s ease-in-out infinite alternate}
.on .card .img img.pfg{animation:fadeIn 1s ease both .4s}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes kb2{0%{transform:scale(1)}100%{transform:scale(1.05)}}
img.pbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover!important;filter:blur(16px) saturate(1.15) brightness(.95);transform:scale(1.3);opacity:.9}
img.pfg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain!important;padding:calc(.6*var(--u))}
.th img.pfg{filter:none}
@keyframes kb{0%{transform:scale(1.02) translate(0,0)}100%{transform:scale(1.14) translate(-2%,-2%)}}
.card .img .emo{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.2vmin) rotate(4deg)}}
.card .b{padding:calc(1.3*var(--u)) calc(1.6*var(--u)) calc(1.5*var(--u))}
.card .n{font-weight:700;font-size:calc(var(--fs)*2.9*var(--u));line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .d{font-family:'Sarabun';font-size:calc(var(--fs)*1.7*var(--u));color:#7A6656;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.hotc::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:250% 100%;animation:sweep 4.5s ease-in-out infinite 1.5s;pointer-events:none}
@keyframes sweep{0%{background-position:150% 0}60%,100%{background-position:-60% 0}}
.prices{display:flex;gap:calc(.8*var(--u));flex-wrap:wrap;margin-top:calc(.7*var(--u))}
.pr{display:inline-flex;align-items:baseline;gap:calc(.5*var(--u));background:#F3E6D6;border-radius:99px;padding:calc(.35*var(--u)) calc(1.2*var(--u));font-size:calc(var(--fs)*1.8*var(--u));color:#6B4E3A}
.on .pr{animation:pop .5s cubic-bezier(.3,1.7,.5,1) both;animation-delay:calc(1s + var(--i) * .11s)}
@keyframes pop{0%{transform:scale(0)}100%{transform:none}}
.pr b{font-size:calc(var(--fs)*var(--fp)*2.8*var(--u));color:var(--pri);font-weight:800}
.pr.solo{background:var(--pri);color:#fff}.pr.solo b{color:#fff}
.badge{position:absolute;top:calc(1.2*var(--u));left:calc(1.2*var(--u));background:var(--acc);color:#2B1D14;font-weight:700;font-size:calc(var(--fs)*1.8*var(--u));padding:calc(.4*var(--u)) calc(1.3*var(--u));border-radius:99px;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.hot{position:absolute;top:calc(1.2*var(--u));right:calc(1.2*var(--u));background:linear-gradient(135deg,#E74C3C,#C0392B);color:#fff;font-weight:700;font-size:calc(var(--fs)*1.7*var(--u));padding:calc(.4*var(--u)) calc(1.2*var(--u));border-radius:99px;z-index:2;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(231,76,60,.6)}50%{box-shadow:0 0 0 calc(1.2*var(--u)) rgba(231,76,60,0)}}

/* list layout */
.list{flex:1;display:grid;column-gap:calc(5*var(--u));align-content:start;grid-auto-flow:column}
.li{display:flex;align-items:center;gap:calc(1.4*var(--u));padding:calc(1.15*var(--u)) calc(.6*var(--u));border-bottom:calc(.2*var(--u)) dashed rgba(255,243,227,.18);min-width:0;opacity:0;border-radius:calc(1*var(--u))}
.on .li{animation:liIn .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.45s + var(--i) * .06s)}
@keyframes liIn{0%{opacity:0;transform:translateX(-4vmin)}100%{opacity:1;transform:none}}
.li.hl{background:linear-gradient(90deg,rgba(232,163,61,.18),transparent)}
.li .n{font-size:calc(var(--fs)*3.1*var(--u));font-weight:500;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.li .n small{display:block;font-family:'Sarabun';font-size:calc(var(--fs)*1.6*var(--u));opacity:.6;font-weight:400}
.li .tagx{font-size:calc(var(--fs)*1.5*var(--u));background:var(--acc);color:#2B1D14;border-radius:99px;padding:calc(.2*var(--u)) calc(1*var(--u));font-weight:700;flex-shrink:0}
.li .ps{display:flex;gap:calc(1.6*var(--u));flex-shrink:0}
.li .ps span{font-size:calc(var(--fs)*1.7*var(--u));opacity:.65;text-align:center;line-height:1.1;min-width:calc(5*var(--u))}
.li .ps b{display:block;font-size:calc(var(--fs)*var(--fp)*3.3*var(--u));color:var(--acc);font-weight:800}

/* top */
.top{flex:1;display:grid;gap:calc(2.4*var(--u));min-height:0}
.top .hero{position:relative;opacity:0}
.on .top .hero{animation:heroIn 1.1s cubic-bezier(.2,.9,.25,1.1) both .5s}
@keyframes heroIn{0%{opacity:0;transform:scale(.7) rotate(-4deg)}100%{opacity:1;transform:none}}
.top .hero .img{font-size:calc(var(--fs)*16*var(--u))}
.top .hero .n{font-size:calc(var(--fs)*4.4*var(--u))}
.rk{position:absolute;bottom:calc(1.4*var(--u));right:calc(1.4*var(--u));width:calc(10*var(--u));height:calc(10*var(--u));border-radius:50%;background:conic-gradient(from 0deg,#FFE29A,var(--acc),#FFE29A,var(--acc),#FFE29A);color:#2B1D14;display:grid;place-items:center;font-weight:800;font-size:calc(var(--fs)*5*var(--u));z-index:2;box-shadow:0 0 0 calc(.8*var(--u)) rgba(255,255,255,.6),0 0 calc(4*var(--u)) rgba(232,163,61,.8)}
.on .rk{animation:popSpin 1s cubic-bezier(.3,1.6,.5,1) both 1.2s,glow 2.4s ease-in-out infinite 2.2s}
@keyframes glow{50%{box-shadow:0 0 0 calc(.8*var(--u)) rgba(255,255,255,.6),0 0 calc(7*var(--u)) rgba(232,163,61,1)}}
.toplist{display:grid;gap:calc(1.4*var(--u));align-content:center}
.tr{display:flex;align-items:center;gap:calc(1.6*var(--u));background:rgba(255,248,239,.08);border:1px solid rgba(255,255,255,.08);border-radius:calc(2*var(--u));padding:calc(1.2*var(--u)) calc(1.6*var(--u));opacity:0;backdrop-filter:blur(4px)}
.on .tr{animation:trIn .8s cubic-bezier(.2,.9,.25,1.1) both;animation-delay:calc(.9s + var(--i) * .15s)}
@keyframes trIn{0%{opacity:0;transform:translateX(8vmin)}100%{opacity:1;transform:none}}
.tr .no{width:calc(6*var(--u));height:calc(6*var(--u));border-radius:calc(1.6*var(--u));display:grid;place-items:center;font-weight:800;font-size:calc(var(--fs)*3.2*var(--u));background:#3A271B;color:var(--acc);flex-shrink:0}
.tr:nth-child(1) .no{background:linear-gradient(135deg,#E8ECF1,#AEB6C1);color:#2B1D14}.tr:nth-child(2) .no{background:linear-gradient(135deg,#F0B98A,#C98549);color:#2B1D14}
.tr .th{width:calc(9*var(--u));height:calc(9*var(--u));border-radius:calc(1.6*var(--u));overflow:hidden;background:#3A271B;display:grid;place-items:center;font-size:calc(var(--fs)*4.5*var(--u));flex-shrink:0}
.tr .th img{width:100%;height:100%;object-fit:cover}
.tr .th{position:relative}
.tr .n{font-size:calc(var(--fs)*3.2*var(--u));font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.tr .p{font-size:calc(var(--fs)*3*var(--u));color:var(--acc);font-weight:800}
.spark{position:absolute;font-size:calc(var(--fs)*3*var(--u));opacity:0;pointer-events:none;z-index:3}
.on .spark{animation:spark 2.6s ease-in-out infinite}
@keyframes spark{0%{opacity:0;transform:scale(.3) rotate(0)}30%{opacity:1}100%{opacity:0;transform:translateY(-6vmin) scale(1.2) rotate(180deg)}}

/* podium top 3 */
.podium{flex:1;display:grid;gap:calc(2.2*var(--u));min-height:0}
.podium.pl{grid-template-columns:1fr 1.2fr 1fr;align-items:end}
.podium.pl .pod{height:88%}.podium.pl .pod1{height:100%}
.podium.pp{grid-template-columns:1fr 1fr;grid-template-rows:1.25fr 1fr}
.podium.pp .pod1{grid-column:1/-1}
.pod{opacity:0}
.on .pod{animation:podIn .9s cubic-bezier(.2,.9,.25,1.15) both;animation-delay:calc(.45s + var(--i) * .22s)}
@keyframes podIn{0%{opacity:0;transform:translateY(12vmin) scale(.85)}100%{opacity:1;transform:none}}
.pod .n{font-size:calc(var(--fs)*3.4*var(--u))}.pod1 .n{font-size:calc(var(--fs)*4.2*var(--u))}
.pod .img{font-size:calc(var(--fs)*12*var(--u))}
.pod .rk{width:calc(8*var(--u));height:calc(8*var(--u));font-size:calc(var(--fs)*4*var(--u))}
.pod2 .rk{background:conic-gradient(#F5F7FA,#AEB6C1,#F5F7FA,#AEB6C1,#F5F7FA)}.pod3 .rk{background:conic-gradient(#F6C8A0,#C98549,#F6C8A0,#C98549,#F6C8A0)}
.pod1{box-shadow:0 0 0 calc(.5*var(--u)) var(--acc),0 calc(1.5*var(--u)) calc(5*var(--u)) rgba(232,163,61,.45)}
.restrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:calc(1.4*var(--u));margin-top:calc(1.8*var(--u))}
.restrow .tr{padding:calc(.8*var(--u)) calc(1.2*var(--u))}
.restrow .tr .th{width:calc(6.5*var(--u));height:calc(6.5*var(--u))}
.restrow .tr .n{font-size:calc(var(--fs)*2.5*var(--u))}.restrow .tr .p{font-size:calc(var(--fs)*2.4*var(--u))}

/* spotlight: 1 เมนูต่อเฟรม */
.spotslide{padding-top:calc(.5*var(--u))}
.spot{flex:1;display:grid;gap:calc(3*var(--u));min-height:0}
.spot.sl{grid-template-columns:1.25fr 1fr;align-items:stretch}
.spot.sp2{grid-template-rows:1.35fr auto}
.sp-img{position:relative;border-radius:calc(3*var(--u));overflow:hidden;display:grid;place-items:center;font-size:calc(var(--fs)*22*var(--u));box-shadow:0 calc(1.5*var(--u)) calc(5*var(--u)) rgba(0,0,0,.5);min-height:0}
.sp-img img:not(.pbg){position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.on .sp-img{animation:spIn .8s cubic-bezier(.2,.9,.25,1.1) both .1s}
.on .sp-img img:not(.pbg){animation:spZoom 7s ease-out both}
.sp-img.full{box-shadow:none;border-radius:0;overflow:visible}
.sp-img.full img.pfg{inset:0;margin:auto;width:auto;height:auto;max-width:100%;max-height:100%;padding:0;border-radius:calc(3*var(--u));box-shadow:0 calc(1.5*var(--u)) calc(5*var(--u)) rgba(0,0,0,.55)}
.on .sp-img.full img.pfg{animation:spFull .9s cubic-bezier(.2,.9,.25,1.1) both}
@keyframes spFull{0%{opacity:0;transform:scale(.92)}100%{opacity:1;transform:none}}
@keyframes spIn{0%{opacity:0;transform:scale(.9) translateX(-4vmin)}100%{opacity:1;transform:none}}
@keyframes spZoom{0%{transform:scale(1.12)}100%{transform:scale(1)}}
.sp-info{display:flex;flex-direction:column;justify-content:center;gap:calc(1.4*var(--u));min-width:0}
.sp-info>*{opacity:0}
.on .sp-info>*{animation:slideR .7s cubic-bezier(.2,.8,.2,1) both}
.on .sp-info>*:nth-child(1){animation-delay:.35s}.on .sp-info>*:nth-child(2){animation-delay:.45s}.on .sp-info>*:nth-child(3){animation-delay:.55s}.on .sp-info>*:nth-child(4){animation-delay:.7s}.on .sp-info>*:nth-child(5){animation-delay:.85s}
.sp-tag{align-self:flex-start;font-size:calc(var(--fs)*2.8*var(--u));font-weight:800;color:#2B1D14;background:linear-gradient(135deg,#FFE29A,var(--acc));padding:calc(.6*var(--u)) calc(2*var(--u));border-radius:99px;box-shadow:0 0 calc(3*var(--u)) rgba(232,163,61,.5)}
.sp-badge{align-self:flex-start;font-size:calc(var(--fs)*2.2*var(--u));background:#fff;color:var(--pri);font-weight:700;padding:calc(.3*var(--u)) calc(1.6*var(--u));border-radius:99px}
.sp-info h3{font-size:calc(var(--fs)*9*var(--u));line-height:1.02;font-weight:800;color:#fff;text-shadow:0 calc(.6*var(--u)) calc(3*var(--u)) rgba(0,0,0,.5)}
.sp2 .sp-info h3{font-size:calc(var(--fs)*8*var(--u))}
.sp-info p{font-size:calc(var(--fs)*2.8*var(--u));font-family:'Sarabun';opacity:.85}
.sp-prices{display:flex;gap:calc(1.6*var(--u));flex-wrap:wrap}
.sp-pr{background:rgba(255,248,239,.1);border:1px solid rgba(255,255,255,.18);border-radius:calc(2*var(--u));padding:calc(1*var(--u)) calc(2.2*var(--u));text-align:center;min-width:calc(14*var(--u));backdrop-filter:blur(6px)}
.sp-pr span{display:block;font-size:calc(var(--fs)*2.2*var(--u));opacity:.8}
.sp-pr b{display:block;font-size:calc(var(--fs)*var(--fp)*7*var(--u));line-height:1;color:var(--acc);font-weight:800}
.on .sp-pr{animation:pop .55s cubic-bezier(.3,1.7,.5,1) both;animation-delay:calc(1s + var(--i) * .12s)}

/* promo */

var TH_DAYN = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];

function thDay(ds, withDay) { var d = dObj(ds); return (withDay ? 'วัน' + TH_DAYN[d.getDay()] + 'ที่ ' : '') + d.getDate() + ' ' + TH_MS2[d.getMonth()]; }

  return thDay(c.start) + ' – ' + thDay(c.end) + ' ' + (b.getFullYear() + 543);
}

    if (!best || score > best.score) best = { c, r, score, sq };
  }
  return best || { c: Math.min(count, isLand() ? 4 : 2), r: Math.ceil(count / Math.min(count, isLand() ? 4 : 2)), sq: 0, score: 0 };
}
function cardPlan(n) {
  let best = null;
  for (let per = 2; per <= 12; per++) {
    const pages = Math.ceil(n / per), sizes = [];
    for (let i = 0; i < pages; i++) sizes.push(Math.floor(n / pages) + (i < n % pages ? 1 : 0));
    const sc = sizes.reduce((a, x) => a + fitGrid(x).score, 0) / pages + Math.min(per, n) * .04 - pages * .04;
    if (!best || sc > best.sc) best = { sc, sizes };
  }
  return best;
}

function show(i) {
  const ss = document.querySelectorAll('.slide'), ds = document.querySelectorAll('.dots i');
  document.body.classList.toggle('fullslide', !!(ss[i] && ss[i].classList.contains('full')));
  ss.forEach((s, j) => { const was = s.classList.contains('on'); s.classList.toggle('on', j === i); s.classList.toggle('out', was && j !== i); });
  setTimeout(() => ss.forEach(s => s.classList.remove('out')), 1200);
  ds.forEach((s, j) => s.classList.toggle('on', j === i));
  const own = ss[i] && num(ss[i].dataset.sec);
  const sec = own || Math.max(5, num(P.sec) || num(D.config.slideSeconds) || 12);
  const pr = document.getElementById('prog');
  if (pr) { pr.style.transition = 'none'; pr.style.width = '0'; void pr.offsetWidth; pr.style.transition = `width ${sec}s linear`; pr.style.width = '100%'; }
  clearTimeout(timer);
  if (ss.length > 1) timer = setTimeout(() => { idx = (i + 1) % ss.length; show(idx); }, sec * 1000);
}
function tick() {

  if (c) c.innerHTML = String(d.getHours()).padStart(2, '0') + '<span class="col">:</span>' + String(d.getMinutes()).padStart(2, '0');
  if (t) t.textContent = d.toLocaleDateString('th-TH', { weekday:'long', day:'numeric', month:'long' });

function fullscreen() { const el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el); }

/* อนุภาคลอย: เมล็ดกาแฟ + แสงโบเก้ */
let fxRun = false;
function startFx() {
  if (fxRun) return; fxRun = true;
  const cv = document.getElementById('fx'); if (!cv) return;
  const g = cv.getContext('2d');
  let W, Hh, parts = [];
  const acc = getComputedStyle(document.documentElement).getPropertyValue('--acc').trim() || '#E8A33D';
  const resize = () => { W = cv.width = innerWidth; Hh = cv.height = innerHeight; };
  resize(); addEventListener('resize', resize);
  const mk = (y) => { const bean = Math.random() < .45, s = Math.min(W, Hh);
    const fe = FEST && Math.random() < .6 ? FEST.t.fx[Math.floor(Math.random() * FEST.t.fx.length)] : '';
    return { bean, fe, x: Math.random() * W, y: y ?? Math.random() * Hh, r: bean ? s * (.008 + Math.random() * .01) : s * (.004 + Math.random() * .03),
      vy: -(0.15 + Math.random() * .45), vx: (Math.random() - .5) * .25, a: Math.random() * Math.PI * 2, va: (Math.random() - .5) * .01, o: bean ? .25 + Math.random() * .25 : .05 + Math.random() * .12 }; };
  for (let i = 0; i < 34; i++) parts.push(mk());
  const draw = () => {
    const c2 = document.getElementById('fx'); if (!c2) { fxRun = false; return; }
    g.clearRect(0, 0, W, Hh);
    parts.forEach((p, i) => {
      p.x += p.vx; p.y += p.vy; p.a += p.va;
      if (p.y < -60 || (p.fe && !FEST) || (!p.fe && FEST && Math.random() < .002)) parts[i] = mk(p.y < -60 ? Hh + 40 : p.y);
      g.save(); g.globalAlpha = p.o; g.translate(p.x, p.y); g.rotate(p.a);
      if (p.fe && FEST) {
        g.globalAlpha = Math.min(.85, p.o * 2.6); g.font = Math.round(p.r * 3.2 + 14) + 'px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(p.fe, 0, 0);
      } else if (p.bean) {
        g.fillStyle = '#7A4A2A'; g.beginPath(); g.ellipse(0, 0, p.r, p.r * 1.4, 0, 0, Math.PI * 2); g.fill();
        g.strokeStyle = '#3A2214'; g.lineWidth = p.r * .22; g.beginPath(); g.moveTo(0, -p.r * 1.2); g.quadraticCurveTo(p.r * .45, 0, 0, p.r * 1.2); g.stroke();
      } else {
        const gr = g.createRadialGradient(0, 0, 0, 0, 0, p.r); gr.addColorStop(0, acc); gr.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = gr; g.beginPath(); g.arc(0, 0, p.r, 0, Math.PI * 2); g.fill();
      }
      g.restore();
    });
    requestAnimationFrame(draw);
  };
  draw();
}
