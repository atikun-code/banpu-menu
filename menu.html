<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<script src="config.js"></script>
<title>เมนู • กาแฟสดบ้านปู</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A2C17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&family=Sarabun:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--pri:#6B4226;--acc:#E8A33D;--bg:#FBF6EF;--ink:#2B1D14;--muted:#8A7A6D;--line:#EFE4D8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:var(--spt,170px);-webkit-text-size-adjust:100%}
button,a,.chip,[data-item],[data-go]{touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,.06);cursor:pointer}
.chips{overscroll-behavior-x:contain}
body{font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;max-width:720px;margin:0 auto;min-height:100vh}
h1,h2,h3,.chip,.btn,.price b,.nm{font-family:'Prompt',sans-serif}

/* hero */
.hero{position:relative;overflow:hidden;contain:paint;color:#fff;padding:28px 20px 26px;background:linear-gradient(160deg,var(--pri),#2B1D14);border-radius:0 0 28px 28px}
.hero .bl{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.hero .bl.a{width:240px;height:240px;background:var(--acc);top:-90px;right:-60px;opacity:.45}
.hero .bl.b{width:200px;height:200px;background:#C26A8A;bottom:-110px;left:-60px;opacity:.25;animation-duration:24s}
@keyframes drift{100%{transform:translate(-30px,30px) scale(1.15)}}
.hero .bean{position:absolute;font-size:22px;opacity:.18;animation:float 9s linear infinite}
@keyframes float{0%{transform:translateY(40px) rotate(0)}100%{transform:translateY(-220px) rotate(360deg)}}
.hero-in{position:relative;display:flex;gap:14px;align-items:center}
.logo{width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,var(--acc),#f6c76f);display:grid;place-items:center;font-size:36px;overflow:hidden;flex-shrink:0;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.logo img{width:100%;height:100%;object-fit:cover}
.hero h1{font-size:26px;line-height:1.15;font-weight:800}
.hero p{opacity:.85;font-size:14.5px}
.status{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;background:rgba(255,255,255,.14);padding:3px 10px;border-radius:99px}
.status i{width:8px;height:8px;border-radius:50%;background:#4CD964;box-shadow:0 0 0 0 rgba(76,217,100,.7);animation:ping 1.8s infinite}
.status.closed i{background:#FF6B6B;animation:none}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(76,217,100,0)}100%{box-shadow:0 0 0 0 rgba(76,217,100,0)}}
.acts{position:relative;display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;text-decoration:none;font-size:14px;border:1px solid rgba(255,255,255,.18)}

/* search + chips */
.bar{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid transparent;transition:.2s}
.bar.sh{border-color:var(--line);box-shadow:0 6px 18px rgba(60,35,15,.06)}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 12px}
.search input{border:0;outline:0;font:inherit;padding:11px 0;flex:1;background:transparent;min-width:0}
.chips{position:relative;display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:9px 16px;min-height:40px;display:inline-flex;align-items:center;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap;transition:background-color .2s,color .2s}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}

main{padding:6px 16px 40px}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec-h h2{font-size:20px}
.sec-h .n{font-size:13px;color:var(--muted);margin-left:auto}

/* promos */
.promos{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 8px;scrollbar-width:none}
.promos::-webkit-scrollbar{display:none}
.promo{scroll-snap-align:start;flex:0 0 86%;min-height:150px;border-radius:20px;position:relative;overflow:hidden;color:#fff;display:flex;align-items:flex-end;padding:16px;background:linear-gradient(135deg,var(--pri),#C26A8A)}
.promo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.promo::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent 70%)}
.promo .tx{position:relative;z-index:1}
.promo.poster-m{padding:0;background:#000;min-height:0;align-items:stretch}.promo.poster-m::after{display:none}
.promo.poster-m img{position:static;width:100%;height:auto;max-height:70vh;object-fit:contain;display:block}
.promo h3{font-size:20px;line-height:1.2}
.promo .pp{display:inline-block;margin-top:6px;background:var(--acc);color:#2B1D14;font-family:'Prompt';font-weight:700;padding:2px 12px;border-radius:99px}
.promo .k{font-size:12px;background:#fff;color:var(--pri);border-radius:99px;padding:1px 9px;font-weight:700;display:inline-block;margin-bottom:6px}

/* best sellers */
.best{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.best::-webkit-scrollbar{display:none}
.bcard{flex:0 0 138px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 14px rgba(60,35,15,.08);cursor:pointer;position:relative}
.bcard .im{aspect-ratio:1;display:grid;place-items:center;font-size:44px;position:relative}
.bcard .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bcard .rk{position:absolute;top:8px;left:8px;z-index:1;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#2B1D14;font-family:'Prompt';font-weight:800;display:grid;place-items:center;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.bcard .t{padding:8px 10px 10px}
.bcard .nm{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard .fr{font-size:13px;color:var(--muted)}.bcard .fr b{color:var(--pri);font-family:'Prompt'}

/* items */
.item{display:flex;gap:12px;padding:12px;background:#fff;border-radius:18px;margin-bottom:10px;border:1px solid #F1E7DC;cursor:pointer;transition:transform .15s}
.item:active{transform:scale(.98)}
.item .im{width:84px;height:84px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;font-size:36px;overflow:hidden;position:relative}
.item .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.item .bd{flex:1;min-width:0;display:flex;flex-direction:column}
.item .nm{font-size:16.5px;font-weight:600;line-height:1.25}
.item .ds{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin:3px 0}
.tg{font-size:11.5px;font-family:'Prompt';padding:1px 8px;border-radius:99px;background:#FFF1DB;color:#8A5A00}
.tg.hot{background:#FDE3E0;color:#C0392B}
.tg.so{background:#3A2E27;color:#fff}
.item.so .im img,.item.so .im{filter:grayscale(1);opacity:.6}
.item.so .nm,.item.so .prices{opacity:.5}
.item.so .prices{text-decoration:line-through}
.bcard.so .im{filter:grayscale(1);opacity:.6}
.soldnote{margin-top:10px;background:#3A2E27;color:#fff;border-radius:12px;padding:8px 12px;font-size:14px}
.closed-card{margin:-6px 16px 10px;position:relative;z-index:3;display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,#C0392B,#E67E22);color:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 10px 24px -8px rgba(192,57,43,.55);animation:ccIn .6s cubic-bezier(.2,.9,.3,1.2) both}
.closed-card .cc-ic{font-size:34px;line-height:1;animation:bob 2.4s ease-in-out infinite}
.closed-card b{display:block;font-family:'Prompt';font-size:20px;line-height:1.25}
.cc-k{display:inline-block;background:#fff;color:#C0392B;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700;margin-bottom:4px}
.cc-cd{display:inline-block;margin-top:4px;background:rgba(0,0,0,.22);border-radius:99px;padding:1px 10px;font-size:13px}
.cc-m{font-size:14px;opacity:.95;margin-top:4px}
.cc-o{display:inline-block;margin-top:8px;background:#fff;color:#1E5E3A;border-radius:10px;padding:4px 10px;font-weight:700;font-size:14px}
@keyframes ccIn{0%{opacity:0;transform:translateY(-8px) scale(.97)}100%{opacity:1;transform:none}}
.fest{margin:-6px 16px 0;position:relative;z-index:2;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--acc),#fff);color:#2B1D14;border-radius:16px;padding:10px 14px;font-family:'Prompt';font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.fest .fe{font-size:26px;animation:bob 2.4s ease-in-out infinite}
.fest small{display:block;font-weight:400;font-family:'Sarabun';opacity:.75}
.prices{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.price{font-size:12.5px;color:var(--muted);background:#F7EFE6;padding:2px 9px;border-radius:99px}
.price b{font-size:15px;color:var(--pri);margin-left:2px}
.price.solo{background:var(--pri);color:#fff}.price.solo b{color:#fff}
.pfg{object-fit:contain!important}
.reveal{opacity:1}
.empty{text-align:center;color:var(--muted);padding:40px 0}

/* info */
.info{background:#fff;border-radius:20px;padding:16px;margin-top:22px;display:grid;gap:10px;box-shadow:0 2px 10px rgba(60,35,15,.05)}
.info .r{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.info .r i{font-style:normal;width:24px;text-align:center}
.wifi{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#2B1D14,var(--pri));color:#fff;border-radius:18px;padding:14px 16px;margin-top:22px}
.wifi .ic{font-size:28px}
.wifi b{font-family:'Prompt'}
.wifi button{margin-left:auto;font:inherit;font-size:13px;border:0;background:var(--acc);color:#2B1D14;border-radius:99px;padding:6px 12px;cursor:pointer}
.note{margin-top:14px;font-size:14px;color:#7A5410;background:#FFF6E5;border:1px solid #F2D9A6;border-radius:14px;padding:10px 12px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:10px 0 30px}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(20,12,6,.5);z-index:40;opacity:0;pointer-events:none;transition:.25s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:720px;transform:translate(-50%,105%);background:#fff;border-radius:26px 26px 0 0;z-index:41;transition:transform .35s cubic-bezier(.2,.9,.25,1);max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:translate(-50%,0)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#ddd;margin:10px auto}
.sheet .big{aspect-ratio:4/3;margin:0 16px;border-radius:20px;overflow:hidden;display:grid;place-items:center;font-size:90px;position:relative}
.sheet .big img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sheet .c{padding:16px 20px 24px}
.sheet h3{font-size:24px;line-height:1.2}
.sheet .ds{color:var(--muted);margin-top:4px}
.sheet .opts{display:grid;gap:8px;margin-top:14px}
.sheet .opt{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:14px;font-family:'Prompt'}
.sheet .opt b{font-size:20px;color:var(--pri)}
.sheet .hint{margin-top:14px;font-size:14px;color:var(--muted);text-align:center}
.sheet .x{position:absolute;right:12px;top:8px;z-index:5;border:0;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.18);width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:#2B1D14;color:#fff;padding:9px 16px;border-radius:12px;z-index:60;transition:.25s;font-size:14px}
.toast.on{transform:translate(-50%,0)}
.load{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
.cup{font-size:46px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"><div class="load"><div style="text-align:center"><div class="cup">☕</div>กำลังโหลดเมนู…</div></div></div>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script>
/* ธีมตามเทศกาล ใช้ร่วมกันทั้งจอหน้าร้าน เมนูลูกค้า และหน้าจัดการ */
var THEMES = {
  newyear:    { name:'ปีใหม่',          pri:'#1B2A6B', acc:'#F5C542', bg:'#0B1030', fx:['🎆','✨','🎉','🥂','⭐'], greet:'สวัสดีปีใหม่ ขอให้มีความสุขตลอดปี' },
  cny:        { name:'ตรุษจีน',         pri:'#B3121D', acc:'#F6C24A', bg:'#300406', fx:['🧧','🏮','🍊','✨','🐉'], greet:'ซินเจียยู่อี่ ซินนี้ฮวดไช้' },
  valentine:  { name:'วาเลนไทน์',       pri:'#C2185B', acc:'#FF8FB1', bg:'#2A0716', fx:['❤️','💕','🌹','💖','✨'], greet:'Happy Valentine ส่งความหวานให้คนพิเศษ' },
  children:   { name:'วันเด็ก',          pri:'#E65100', acc:'#4FC3F7', bg:'#2A1203', fx:['🎈','🧸','🍭','⭐','🎨'], greet:'สุขสันต์วันเด็ก' },
  teacher:    { name:'วันครู',           pri:'#6A1B9A', acc:'#FFD54F', bg:'#1E0A2B', fx:['📖','🌼','🙏','✨','✏️'], greet:'สุขสันต์วันครู ขอบคุณครูทุกท่าน' },
  songkran:   { name:'สงกรานต์',        pri:'#0A7EA4', acc:'#5ED3F3', bg:'#052430', fx:['💦','🌸','💧','🌼','🐘'], greet:'สุขสันต์วันสงกรานต์ คลายร้อนกันหน่อย' },
  school:     { name:'เปิดเทอม',         pri:'#2E7D32', acc:'#FFB300', bg:'#0C2210', fx:['📚','✏️','🎒','⭐','📐'], greet:'เปิดเทอมแล้ว สู้ ๆ นะ' },
  buddhist:   { name:'วันสำคัญทางพุทธ',  pri:'#A8740A', acc:'#F4D06F', bg:'#241904', fx:['🪷','🕯️','✨','🌕'], greet:'ร่วมทำบุญ จิตใจผ่องใส' },
  mother:     { name:'วันแม่',           pri:'#1E5AA8', acc:'#9CC8FF', bg:'#0A1B33', fx:['🤍','💙','🌼','✨'], greet:'สุขสันต์วันแม่ รักแม่ที่สุด' },
  halloween:  { name:'ฮาโลวีน',          pri:'#5B2A86', acc:'#FF8A00', bg:'#150920', fx:['🎃','🦇','👻','🕸️','🍬'], greet:'Happy Halloween' },
  loykrathong:{ name:'ลอยกระทง',         pri:'#14306B', acc:'#FFC857', bg:'#060E24', fx:['🪷','🏮','🌕','✨','🕯️'], greet:'สุขสันต์วันลอยกระทง' },
  father:     { name:'วันพ่อ',           pri:'#B8860B', acc:'#FFE066', bg:'#2A2003', fx:['💛','🌼','✨','🙏'], greet:'สุขสันต์วันพ่อ' },
  christmas:  { name:'คริสต์มาส',        pri:'#1B5E20', acc:'#E53935', bg:'#071C0A', fx:['🎄','❄️','⛄','🎁','✨'], greet:'Merry Christmas' },
  celebrate:  { name:'ฉลอง/โปรพิเศษ',    pri:'#6B4226', acc:'#E8A33D', bg:'#1A100A', fx:['🎉','✨','🎊','⭐'], greet:'ขอบคุณที่อุดหนุน' }
};
/** หาธีมที่ใช้วันนี้: config.themeForce (บังคับ) > เทศกาลที่ครอบคลุมวันนี้ (ถ้าเปิดอัตโนมัติ) */
function pickTheme(cfg, events, ds, force) {
  cfg = cfg || {};
  var k = force || cfg.themeForce;
  if (k === 'none') return null;
  if (k && THEMES[k]) return { key:k, t:THEMES[k], name:THEMES[k].name, greet:THEMES[k].greet };
  if (cfg.themeAuto === 'N') return null;
  var hit = (events || []).filter(function (e) { return e.theme && THEMES[e.theme] && e.start <= ds && (e.end || e.start) >= ds; })
    .sort(function (a, b) { return (a.end || a.start) < (b.end || b.start) ? -1 : 1; })[0];
  if (!hit) return null;
  return { key:hit.theme, t:THEMES[hit.theme], name:hit.name, greet:hit.greeting || THEMES[hit.theme].greet };
}
/** ขอรูปจาก Google Drive ในขนาดที่ใช้จริง (เร็วกว่าโหลดไฟล์เต็ม) */
function sz(u, w) { u = String(u || ''); return u.indexOf('googleusercontent.com') > -1 && u.indexOf('=') < 0 ? u + '=w' + w : u; }
/** โหลดข้อมูลจอ/เมนู: ใน Apps Script ใช้ google.script.run • บน GitHub Pages ใช้ fetch ไปที่ BP_API (ตั้งใน config.js) */
function fetchDisplay(ok, fail) {
  if (window.BP_API) {
    fetch(window.BP_API + (window.BP_API.indexOf('?') > -1 ? '&' : '?') + 'api=display&t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.error) throw new Error(d.error); ok(d); })
      .catch(function (e) { fail(e || new Error('โหลดข้อมูลไม่สำเร็จ')); });
  } else google.script.run.withSuccessHandler(ok).withFailureHandler(fail).getDisplayData();
}
/** ลิงก์เมนูลูกค้า: ถ้ามีเว็บสาธารณะ (publicUrl) ใช้ menu.html ของเว็บนั้น */
function publicBase(cfg) { var u = String((cfg && cfg.publicUrl) || '').trim(); return u ? u.replace(/[?#].*$/, '').replace(/index\.html$/, '').replace(/\/?$/, '/') : ''; }
function menuLink(D) {
  /* เปิดจากเว็บสาธารณะ (GitHub) → QR ชี้ menu.html ของเว็บเดียวกันเสมอ ไม่ต้องพึ่งการตั้งค่า */
  if (window.BP_API && location.protocol.indexOf('http') === 0) return location.origin + location.pathname.replace(/[^\/]*$/, '') + 'menu.html';
  var pb = publicBase(D.config); return pb ? pb + 'menu.html' : (D.appUrl || '') + '?view=menu';
}
/* ---------- ประกาศวันหยุดร้าน ---------- */
var TH_DAYN = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
var TH_MS2 = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function dObj(ds) { return new Date(String(ds).slice(0, 10) + 'T00:00:00'); }
function thDay(ds, withDay) { var d = dObj(ds); return (withDay ? 'วัน' + TH_DAYN[d.getDay()] + 'ที่ ' : '') + d.getDate() + ' ' + TH_MS2[d.getMonth()]; }
function closureRange(c) {
  var a = dObj(c.start), b = dObj(c.end || c.start);
  if (+a === +b) return thDay(c.start, true) + ' ' + (a.getFullYear() + 543);
  if (a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear()) return a.getDate() + '–' + b.getDate() + ' ' + TH_MS2[a.getMonth()] + ' ' + (a.getFullYear() + 543);

/** ประกาศหยุดที่ควรแสดงวันนี้: อยู่ในช่วงประกาศล่วงหน้า (announce วัน, ค่าเริ่มต้น 7) จนถึงวันสุดท้ายที่หยุด */
function closureNow(list, ds) {

    var pre = new Date(dObj(c.start)); pre.setDate(pre.getDate() - (parseInt(c.announce, 10) >= 0 && c.announce !== '' ? parseInt(c.announce, 10) : 7));

    ${m.soldOut ? '<div class="soldnote">ขออภัย เมนูนี้หมดแล้วสำหรับวันนี้ 🙏</div>' : ''}
    ${m.desc ? `<div class="ds">${esc(m.desc)}</div>` : ''}
    ${D.config.showPrices !== 'N' && ps.length ? `<div class="opts">${ps.map(p => `<div class="opt"><span>${p[0] === 'ร้อน' ? '🔥 ร้อน' : p[0] === 'เย็น' ? '🧊 เย็น' : p[0] === 'ปั่น' ? '🌀 ปั่น' : 'ราคา'}</span><b>${num(p[1])} ฿</b></div>`).join('')}</div>` : ''}
    <div class="hint">แจ้งชื่อเมนูกับพนักงานเพื่อสั่งได้เลย ☕</div></div>`;
  $('#ov').classList.add('on'); $('#sheet').classList.add('on');
}
function closeItem() { $('#ov').classList.remove('on'); $('#sheet').classList.remove('on'); }
let io;
function reveal() {
  if (!('IntersectionObserver' in window)) { document.querySelectorAll('.reveal').forEach(x => x.classList.add('in')); return; }
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin:'0px 0px -30px 0px' });
  document.querySelectorAll('.reveal:not(.in)').forEach(x => io.observe(x));
}
let spyQ = 0, barHt = 0;
function barH() { const b = $('#bar'); barHt = b ? b.offsetHeight : 0; document.documentElement.style.setProperty('--spt', (barHt + 8) + 'px'); return barHt; }
function spy() { if (spyQ) return; spyQ = requestAnimationFrame(spyRun); }
function spyRun() {
  spyQ = 0;
  const bar = $('#bar'); if (!bar) return;
  if (!barHt) barH();
  bar.classList.toggle('sh', scrollY > 140);
  const line = barHt + 24; let cur = '';
  const secs = document.querySelectorAll('main .sec');
  for (let k = 0; k < secs.length; k++) { if (secs[k].getBoundingClientRect().top <= line) cur = secs[k].id; else break; }
  if (spy.lock && Date.now() < spy.lock) { centerChipLater(); return; }
  if (cur === spy.cur) return; spy.cur = cur;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.go === cur));
  centerChipLater();
}
/* เลื่อนแถบหมวดให้หมวดปัจจุบันอยู่กลาง "หลังจากหยุดเลื่อนแล้ว" เท่านั้น (เลื่อนซ้อนระหว่างปัดบน iPhone ทำให้หน้าค้าง) */
let ccT;
function centerChipLater() {
  clearTimeout(ccT);
  ccT = setTimeout(() => {
    if (touching || Date.now() - lastAct < 250) return centerChipLater();
    const box = document.querySelector('#bar .chips'), c = box && box.querySelector('.chip.on'); if (!c) return;
    const x = Math.max(0, c.offsetLeft - (box.clientWidth - c.offsetWidth) / 2);
    if (Math.abs(box.scrollLeft - x) > 4) box.scrollLeft = x;
  }, 300);
}
addEventListener('resize', () => { barH(); spy.cur = null; spy(); }, { passive:true });
let tt; function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 2000); }
boot();
setInterval(boot, 15 * 60 * 1000);
</script>
